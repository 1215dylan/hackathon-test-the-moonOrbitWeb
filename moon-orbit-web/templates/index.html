<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sun, Earth, and Moon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='orbit.css') }}">
  <script defer src="{{ url_for('static', filename='orbit.js') }}"></script>
</head>
<body>
  <main>
    <h1>Sun, Earth, and Moon</h1>
    <div class="controls">
      <form id="date-form">
        <label for="date">Change date</label>
        <input id="date" type="date" value="{{ today }}" min="{{ first_day }}" max="{{ last_day }}" required>
        <button>Apply</button>
      </form>
      <div>
        <button id="play" disabled>Play</button>
        <label for="speed">Play speed</label>
        <input id="speed" type="range" min="0.1" max="5" step="0.1" value="1">
        <output id="speed-value" for="speed">1.0×</output>
      </div>
    </div>
    <p id="status" role="status">Loading simulation…</p>
    <canvas id="orbit" aria-label="Sun, Earth, and Moon. Use the arrow keys or drag to rotate the view." tabindex="0"></canvas>
    <p class="note">Drag or use the arrow keys to rotate. Body sizes are illustrative. The Moon–Earth separation is magnified 30×.</p>
    <dl>
      <div><dt>Simulation time</dt><dd id="time">—</dd></div>
      <div><dt>Moon’s instantaneous orbital eccentricity relative to the Sun</dt><dd id="eccentricity">—</dd></div>
      <div><dt>Sun–Earth</dt><dd id="sun-earth">—</dd></div>
      <div><dt>Earth–Moon</dt><dd id="earth-moon">—</dd></div>
      <div><dt>Sun–Moon</dt><dd id="sun-moon">—</dd></div>
    </dl>
  </main>
</body>
</html>
